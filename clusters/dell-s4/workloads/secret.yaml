---
# Cloud-init secret for the HammerDB RHEL 9 VM.
# The password value must be set before applying (base64-encoded cloud-init userdata YAML).
# Example userdata content (encode with: echo '<yaml>' | base64 -w0):
#   #cloud-config
#   user: cloud-user
#   password: <your-password>
#   chpasswd:
#     expire: false
#   ssh_authorized_keys:
#     - <your-ssh-public-key>
apiVersion: v1
kind: Secret
metadata:
  name: cloudinit-hammerdb
  namespace: gitops-vms
  labels:
    app: hammerdb
    drprotection: "true"
type: Opaque
data:
  userdata: ""
