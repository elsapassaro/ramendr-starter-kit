---
# Managed-application DRPC. It must be in the same namespace as its
# Placement (openshift-gitops) and must not set protectedNamespaces, which
# Ramen only allows for discovered applications in the admin namespace.
# The name must be <placement>-drpc because the console enrollment path
# (Applications > Manage disaster recovery) always creates that name, so this
# manifest and a console enrollment produce one object instead of two. Apply
# it only when no DRPC references the Placement yet: after a console
# enrollment the console owns the DRPC it created.
# Both VM disks carry drprotection=true in the base manifests. After the
# group-backed migration the VM uses cloned PVCs on powerstore-sc-group and
# this selector tracks their dedicated label instead.
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPlacementControl
metadata:
  name: dell-vm-placement-drpc
  namespace: openshift-gitops
  labels:
    cluster.open-cluster-management.io/backup: ramen
  annotations:
    drplacementcontrol.ramendr.openshift.io/resync-on-primary: "true"
spec:
  drPolicyRef:
    apiVersion: ramendr.openshift.io/v1alpha1
    kind: DRPolicy
    name: dr-policy-15m
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: dell-vm-placement
    namespace: openshift-gitops
  preferredCluster: spoke-0
  # pvcSelector is immutable on the DRPC CRD, so it is written in the same
  # matchExpressions form the console produces. A different form is rejected.
  pvcSelector:
    matchExpressions:
      - key: appname
        operator: In
        values:
          - hammerdb-rhel9-mgd-grp
