---
# Managed-application DRPC. It must be in the same namespace as its
# Placement (openshift-gitops) and must not set protectedNamespaces, which
# Ramen only allows for discovered applications in the admin namespace.
# Both VM disks carry drprotection=true in the base manifests. After the
# group-backed migration the VM uses cloned PVCs on powerstore-sc-group and
# this selector tracks their dedicated label instead.
apiVersion: ramendr.openshift.io/v1alpha1
kind: DRPlacementControl
metadata:
  name: dell-win-drpc
  namespace: openshift-gitops
  labels:
    cluster.open-cluster-management.io/backup: ramen
  annotations:
    drplacementcontrol.ramendr.openshift.io/resync-on-primary: "true"
spec:
  drPolicyRef:
    apiVersion: ramendr.openshift.io/v1alpha1
    kind: DRPolicy
    name: dr-policy-15m
  placementRef:
    apiVersion: cluster.open-cluster-management.io/v1beta1
    kind: Placement
    name: dell-win-placement
    namespace: openshift-gitops
  preferredCluster: spoke-0
  pvcSelector:
    matchExpressions:
      - key: appname
        operator: In
        values:
          - hammerdb-win-mgd-grp
