---
# Minimal override for DR cluster names, versions, and regions.
# This file is applied after chart defaults (override merged last). It only contains overlay keys
# (clusterOverrides, drpc) so chart regionalDR defaults are preserved.
# Also works if merged first: -f overrides/values-cluster-names.yaml -f charts/hub/rdr/values.yaml

clusterOverrides:
  primary:
    name: ocp-primary
    version: 4.21.1
    install_config:
      metadata:
        name: ocp-primary
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              # m5.metal: bare-metal instances expose /dev/kvm directly, required
              # for KubeVirt VMs. m5.4xlarge in eu-north-1 does not expose the
              # vmx CPU flag so devices.kubevirt.io/kvm is never advertised.
              # rootVolume: 300 GB gp3 avoids ephemeral-storage DiskPressure
              # (default RHCOS image disk is ~16 GB without an explicit override).
              type: m5.metal
              rootVolume:
                iops: 4000
                size: 300
                type: gp3
      platform:
        aws:
          region: eu-north-1
  secondary:
    name: ocp-secondary
    version: 4.21.1
    install_config:
      metadata:
        name: ocp-secondary
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              # Same as primary: m5.metal for KVM support on eu-west-1 workers.
              type: m5.metal
              rootVolume:
                iops: 4000
                size: 300
                type: gp3
      platform:
        aws:
          region: eu-west-1

# DRPC overrides (preferredCluster defaults to primary if unset)
drpc:
  preferredCluster: ocp-primary
