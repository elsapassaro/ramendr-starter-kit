---
# Spoke-mode overrides for vp-manage-proxy-cluster-ca-chart.
# Enables the differential CA bundle (cluster CAs only, no system trust store)
# for consumers like Velero/OADP that need private cluster CAs without the
# full system CA package. The by-label bundle targets namespaces labeled with
# cluster-ca.vp.io/differential-ca-target: "true" (e.g. openshift-adp).
# ConfigMap data key is "cabundle" (no dots — YAML-safe for Ramen/Velero).
trustManager:
  differentialBundle:
    enabled: true
    targetKey: cabundle
  byNamespaceNameBundle:
    enabled: true
  byLabelBundle:
    enabled: true

# Chart 0.2.x defaults these to registry.redhat.io/openshift4/ose-cli:latest,
# which registry.redhat.io rejects. The in-cluster cli Imagestream tracks the
# cluster’s release so export/sync Jobs can pull.
eso:
  export:
    image:
      repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
      tag: latest
syncJob:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
    tag: latest
trustTest:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
    tag: latest
