---
# Mixed Linux + Windows edge VMs for DR testing on gitops-vms.
# Linux: cloud-init + SSH keys from Vault (disableExternalSecrets must stay false).
# Windows: CDI registry import + OpenSSH on port 22 (Administrator password in ~/values-secret.yaml).
# Must be false so edge VMs get a cloud-init disk (user/password/SSH from Vault).
# Secrets still come from ~/values-secret.yaml via pattern load-secrets; do not set true unless
# you attach cloud-init another way (see dr-validation/examples/cloud-init-fragment.yaml).
disableExternalSecrets: false
waitForMetalNode: false

# Pin >= 0.5.2 for additionalPvcDisks.
edgeGitopsVms:
  chartVersion: "0.5.2"

vmDefaults:
  accessMode: "ReadWriteMany"
  storageClassName: "ocs-storagecluster-ceph-rbd-virtualization"
  volumeMode: "Block"
  count: 1
  flavor: medium
  workload: server
  os: rhel9
  storage: 30Gi
  memory: 4Gi
  cores: 1
  sockets: 1
  threads: 1
  template: rhel9-server-medium
  sshsecret: secret/data/global/vm-ssh
  cloudinitsecret: secret/data/global/cloud-init
  sshpubkeyfield: publickey
  publishService: true
  extraLabels:
    drprotection: true
  ports:
    - name: ssh
      port: 22
      protocol: TCP
      targetPort: 22

vms:
  edgenode:
    count: 1
    role: node
    additionalDisks:
      - name: data
        storage: 10Gi

  edgenode-pvc:
    count: 1
    role: node-pvc
    additionalPvcDisks:
      - name: data
        storage: 10Gi
        # create: true (default) — chart creates a standalone PVC, not a DataVolume
        # accessMode, storageClassName, and volumeMode are inherited from vmDefaults
        # (ReadWriteMany / ocs-storagecluster-ceph-rbd-virtualization / Block)

  windows2022:
    count: 1
    role: server
    os: windows2k22
    storageClassName: "ocs-storagecluster-ceph-rbd-virtualization"
    efi: true
    # mainDiskStorageBus: virtio (chart default; avoids libvirt IOError auto-pause seen with sata)
    storage: 45Gi
    memory: 8Gi
    cores: 2
    machineType: q35
    template: windows2k22-server-medium
    extraLabels:
      drprotection: true
    ports:
      - name: ssh
        port: 22
        protocol: TCP
        targetPort: 22
      - name: rdp
        port: 3389
        protocol: TCP
        targetPort: 3389
    additionalDisks:
      - name: data
        storage: 10Gi

  windows2025:
    count: 1
    role: server
    os: windows2k25
    storageClassName: "ocs-storagecluster-ceph-rbd-virtualization"
    efi: true
    # mainDiskStorageBus: virtio (chart default; see windows2022 comment)
    storage: 45Gi
    memory: 8Gi
    cores: 2
    machineType: q35
    template: windows2k25-server-medium
    extraLabels:
      drprotection: true
    ports:
      - name: ssh
        port: 22
        protocol: TCP
        targetPort: 22
      - name: rdp
        port: 3389
        protocol: TCP
        targetPort: 3389
    additionalPvcDisks:
      - name: data
        storage: 10Gi

# One CDI import per Windows image per cluster; VMs clone from the DataSource.
# CDI size uses decimal G; Quay images are 40 GiB qcow2 — 40G import PVC is too small.
externalDataSources:
  windows2k22:
    name: windows2k22
    type: registry
    url: 'docker://quay.io/martjack/windows-server-2022-standard:latest'
    registryCredentialsSecret: windows-registry-creds
    size: 45G
  windows2k25:
    name: windows2k25
    type: registry
    url: 'docker://quay.io/martjack/windows-server-2025-standard:latest'
    registryCredentialsSecret: windows-registry-creds
    size: 45G

registryCredentialExternalSecrets:
  windows-registry-creds:
    vaultKey: secret/data/global/privatevm-credentials
