---
# Hub overrides for vp-manage-proxy-cluster-ca-chart.
# Enables the differential CA bundle (cluster API/ingress CAs only, no system trust store)
# in openshift-config as vp-pattern-proxy-ca-bundle-differential (key: cabundle).
# opp-policy s3-ssl / s3CaInjector read that differential ConfigMap for Ramen caCertificates.
trustManager:
  differentialBundle:
    enabled: true
    targetKey: cabundle
  byNamespaceNameBundle:
    enabled: true
  byLabelBundle:
    enabled: true

# Chart 0.2.x defaults these to registry.redhat.io/openshift4/ose-cli:latest,
# which registry.redhat.io rejects. The in-cluster cli Imagestream tracks the
# cluster’s release so export/sync Jobs can pull.
eso:
  export:
    image:
      repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
      tag: latest
syncJob:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
    tag: latest
trustTest:
  image:
    repository: image-registry.openshift-image-registry.svc:5000/openshift/cli
    tag: latest
