---
# Optional overlay focused on AWS spend reduction for ephemeral dev/test DR environments.
# Use with: -f overrides/values-aws-cost-optimized.yaml
#
# IMPORTANT:
# - Spot capacity can be reclaimed with a 2-minute warning.
# - Bare-metal is still required for KubeVirt VM scheduling (/dev/kvm support).
# - Keep this profile for non-production testing unless your SLOs accept spot behavior.

clusterOverrides:
  primary:
    install_config:
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              type: c5n.metal
              spotMarketOptions: {}
      platform:
        aws:
          userTags:
            owner: your-user-or-team
            launchedBy: automation-user
            environment: dev
  secondary:
    install_config:
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              type: c5n.metal
              spotMarketOptions: {}
      platform:
        aws:
          userTags:
            owner: your-user-or-team
            launchedBy: automation-user
            environment: dev
