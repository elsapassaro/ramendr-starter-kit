---
# Optional overlay focused on AWS spend reduction for ephemeral dev/test DR environments.
# Use with: -f overrides/values-aws-cost-optimized.yaml
#
# IMPORTANT:
# - Spot capacity can be reclaimed with a 2-minute warning.
# - Bare-metal is still required for KubeVirt VM scheduling (/dev/kvm support).
# - Keep this profile for non-production testing unless your SLOs accept spot behavior.

costManagement:
  ownerTag: your-user-or-team
  launchedByTag: automation-user
  environmentTag: dev

clusterOverrides:
  primary:
    install_config:
      platform:
        aws:
          region: eu-north-1
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              type: c5n.metal
              spotMarketOptions: {}
  secondary:
    install_config:
      platform:
        aws:
          region: eu-west-1
      compute:
        - name: worker
          replicas: 3
          platform:
            aws:
              type: c5n.metal
              spotMarketOptions: {}
