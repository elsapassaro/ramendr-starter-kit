{{- $dr := index .Values.regionalDR 0 }}
{{- $clusterSet := $dr.name }}
{{- $globalnetEnabled := $dr.globalnetEnabled }}
---
apiVersion: v1
kind: Namespace
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  name: {{ $clusterSet }}-broker
---
apiVersion: submariner.io/v1alpha1
kind: Broker
metadata:
  name: submariner-broker
  namespace: {{ $clusterSet }}-broker
  labels:
    cluster.open-cluster-management.io/backup: submariner
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  globalnetEnabled: {{ $globalnetEnabled | default false }}


{{- $effectivePrimary := include "rdr.effectivePrimaryCluster" . | fromJson }}
{{- $effectiveSecondary := include "rdr.effectiveSecondaryCluster" . | fromJson }}
{{- range list $effectivePrimary $effectiveSecondary }}
{{- $cluster := . }}
---
apiVersion: addon.open-cluster-management.io/v1alpha1
kind: ManagedClusterAddOn
metadata:
  name: submariner
  namespace: {{ $cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  installNamespace: submariner-operator

---
apiVersion: submarineraddon.open-cluster-management.io/v1alpha1
kind: SubmarinerConfig
metadata:
  name: submariner
  namespace: {{ $cluster.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "6"
spec:
  gatewayConfig:
    gateways: 1
    aws:
      # c5d/r5d/m5d instance types (NVMe local SSD) fail to bootstrap on OCP 4.21
      # due to rpm-ostreed crash loops. Use non-NVMe instance types instead.
      instanceType: m5.large
  # Use VXLAN instead of libreswan (IPsec). The Submariner operator from the v4.20
  # catalog passes --encapsulation=yes to libreswan on OCP 4.21 RHCOS nodes, which
  # runs pluto 4.15 — an unrecognized flag that prevents the IPsec tunnel from
  # forming. VXLAN avoids libreswan entirely and establishes the tunnel reliably.
  # Note: UDP 4490 (NAT discovery) and UDP 4800 (VXLAN data) must be open in the
  # gateway security groups; the Submariner prerequisites job only opens the IPsec
  # ports (UDP 500/4500/4900). Add these rules manually after the first deployment
  # or automate them via the redeploy.sh script.
  IPSecNATTPort: 4500
  NATTEnable: false
  cableDriver: vxlan
  credentialsSecret:
    name: {{ $cluster.name }}-cluster-aws-creds
  subscriptionConfig:
    # The submariner package is not in redhat-operator-index:v4.21 yet.
    # Use a custom CatalogSource (deployed via ManifestWork) backed by the v4.20 index.
    source: submariner-catalog
    sourceNamespace: openshift-marketplace
    channel: stable-0.22

{{- end }}
