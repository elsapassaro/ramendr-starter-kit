---
clusterGroup:
  name: resilient
  isHubCluster: false

  argoCD:
    resourceTrackingMethod: annotation

  namespaces:
    openshift-cnv: {}
    openshift-storage: {}
    # Admin ns for discovered-app VRGs (must match hub ramenOpsNamespace).
    openshift-dr-ops: {}
    policies: {}
    gitops-vms: {}
    external-dns-operator: {}
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-adp:
      operatorGroup: true
      targetNamespaces:
        - openshift-adp
      labels:
        cluster-ca.vp.io/differential-ca-target: "true"
    openshift-workload-availability:
      operatorGroup: true
      targetNamespaces: []
    cert-manager-operator: {}
    cert-manager: {}
    vp-manage-proxy-cluster-ca: {}

  indexImages:
    rhdr:
      name: rhdr-catalog
      image: quay.io/openshift-virtualization-dr/rhdr-mirror@sha256:d6062169ade884513cb8b4ee7b962c080acc3c496a1cd93347550b2b0d93a093

  subscriptions:
    openshift-virtualization:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable

    external-dns:
      name: external-dns-operator
      namespace: external-dns-operator
      channel: stable-v1

    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1

    node-health-check:
      name: node-healthcheck-operator
      namespace: openshift-workload-availability
      channel: stable

    self-node-remediation:
      name: self-node-remediation
      namespace: openshift-workload-availability
      channel: stable

    openshift-data-foundation:
      name: odf-operator
      namespace: openshift-storage
      channel: stable-4.22

    openshift-oadp:
      name: redhat-oadp-operator
      namespace: openshift-adp
      channel: stable

    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      config:
        env:
          - name: UNSUPPORTED_ADDON_FEATURES
            value: "TrustManager=true"

  argoProjects:
    - resilient

  # Platform overlays (None / BareMetal) switch ODF OSDs to LSO localblock.
  # AWS has no values-AWS.yaml, so this is a no-op there. Keys are ODF-only
  # so CNV, ESO, and other resilient apps can merge the file harmlessly.
  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'

  # Preview RHDR FBC images (Konflux, with rhdr-mirror fallback for GC'd digests).
  extraObjects:
    rhdr-fbc-idms:
      apiVersion: config.openshift.io/v1
      kind: ImageDigestMirrorSet
      metadata:
        name: rhdr-fbc-idms
      spec:
        imageDigestMirrors:
          - source: registry.redhat.io/rhdr/rhdr-hub-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-hub-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-hub-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-hub-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-cluster-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-cluster-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-cluster-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-cluster-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-multicluster-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-multicluster-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-multicluster-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-multicluster-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-csi-addons-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-csi-addons-operator-bundle
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-operator-bundle-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-hub-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramen-operator-base-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-cluster-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramen-operator-base-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-ramen-operator-base-image-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramen-operator-base-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-multicluster-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-multicluster-operator-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-multicluster-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-multicluster-operator-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-csi-addons-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-operator-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-csi-addons-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-operator-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-csi-addons-sidecar-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-sidecar-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-csi-addons-sidecar-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-sidecar-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rhdr/rhdr-ramendr-console-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramendr-console-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.stage.redhat.io/rhdr/rhdr-ramendr-console-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramendr-console-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-hub-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramen-operator-base-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-cluster-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramen-operator-base-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-multicluster-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-multicluster-operator-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-csi-addons-rhel9-operator
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-operator-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-csi-addons-sidecar-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-csi-addons-sidecar-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-ramendr-console-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramendr-console-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
          - source: registry.redhat.io/rh-ocp-dr/rhdr/rhdr-ramen-operator-base-image-rhel9
            mirrors:
              - quay.io/redhat-user-workloads/rhdr-tenant/rhdr/rhdr-ramen-operator-base-image-4-22
              - quay.io/openshift-virtualization-dr/rhdr-mirror
  imperative:
    jobs: []

  applications:
    vp-manage-proxy-cluster-ca:
      name: vp-manage-proxy-cluster-ca
      namespace: vp-manage-proxy-cluster-ca
      argoProject: resilient
      chart: vp-manage-proxy-cluster-ca
      chartVersion: 0.2.*
      syncPolicy:
        automated: {}
        retry:
          limit: 20
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - CreateNamespace=true
      extraValueFiles:
        - '$patternref/overrides/values-vp-manage-proxy-cluster-ca-resilient.yaml'
      ignoreDifferences:
        # Newer than ESO 1.0; omit from chart manifests. Ignore only when live ESO defaults it.
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.dataFrom[].extract.nullBytePolicy

    ensure-openshift-console-plugins:
      name: ensure-openshift-console-plugins
      namespace: openshift-console
      argoProject: resilient
      chart: ensure-openshift-console-plugins
      chartVersion: 0.1.*
      extraValueFiles:
        - '$patternref/overrides/values-console-plugins-spokes.yaml'

    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: resilient
      chart: openshift-external-secrets
      chartVersion: 0.0.*

    openshift-cnv:
      name: openshift-cnv
      namespace: openshift-cnv
      argoProject: resilient
      chart: openshift-virtualization-instance
      chartVersion: 0.1.*

    odf:
      name: odf
      namespace: openshift-storage
      argoProject: resilient
      chart: openshift-data-foundations
      chartVersion: 0.3.*
      extraValueFiles:
        - '$patternref/overrides/values-odf-chart.yaml'

    node-health-check-operator:
      name: node-health-check-operator
      namespace: openshift-workload-availability
      argoProject: resilient
      chart: node-health-check-operator
      chartVersion: 0.1.*

    external-dns-operator:
      name: external-dns-operator
      namespace: external-dns-operator
      argoProject: resilient
      chart: external-dns-operator
      chartVersion: 0.1.*

    adp-data-protection:
      name: adp-data-protection-application
      namespace: openshift-adp
      argoProject: resilient
      chart: data-protection-application
      chartVersion: 0.0.*

  managedClusterGroups: []
