---
clusterGroup:
  name: resilient
  isHubCluster: false

  argoCD:
    resourceTrackingMethod: annotation

  namespaces:
    openshift-cnv: {}
    openshift-storage: {}
    # Admin ns for discovered-app VRGs (must match hub ramenOpsNamespace).
    openshift-dr-ops: {}
    policies: {}
    gitops-vms: {}
    external-dns-operator: {}
    external-secrets-operator:
      operatorGroup: true
      targetNamespaces: []
    openshift-adp:
      operatorGroup: true
      targetNamespaces:
        - openshift-adp
      labels:
        cluster-ca.vp.io/differential-ca-target: "true"
    openshift-workload-availability:
      operatorGroup: true
      targetNamespaces: []
    cert-manager-operator: {}
    cert-manager: {}
    vp-manage-proxy-cluster-ca: {}

  indexImages:
    odf:
      name: odf-catalog
      image: quay.io/rhceph-dev/ocs-registry:4.22.8-1.konflux

  subscriptions:
    openshift-virtualization:
      name: kubevirt-hyperconverged
      namespace: openshift-cnv
      channel: stable

    external-dns:
      name: external-dns-operator
      namespace: external-dns-operator
      channel: stable-v1

    eso:
      name: openshift-external-secrets-operator
      namespace: external-secrets-operator
      channel: stable-v1

    node-health-check:
      name: node-healthcheck-operator
      namespace: openshift-workload-availability
      channel: stable

    self-node-remediation:
      name: self-node-remediation
      namespace: openshift-workload-availability
      channel: stable

    openshift-data-foundation:
      name: odf-operator
      namespace: openshift-storage
      source: odf-catalog
      sourceNamespace: openshift-marketplace
      channel: stable-4.22

    openshift-oadp:
      name: redhat-oadp-operator
      namespace: openshift-adp
      channel: stable

    cert-manager:
      name: openshift-cert-manager-operator
      namespace: cert-manager-operator
      channel: stable-v1
      config:
        env:
          - name: UNSUPPORTED_ADDON_FEATURES
            value: "TrustManager=true"

  argoProjects:
    - resilient

  # Platform overlays (None / BareMetal) switch ODF OSDs to LSO localblock.
  # AWS has no values-AWS.yaml, so this is a no-op there. Keys are ODF-only
  # so CNV, ESO, and other resilient apps can merge the file harmlessly.
  sharedValueFiles:
    - '/overrides/values-{{ $.Values.global.clusterPlatform }}.yaml'

  # Image mirrors shipped in ocs-registry:4.22.8-1.konflux (/idms.yaml).
  extraObjects:
    odf-catalog-mirrors:
      apiVersion: config.openshift.io/v1
      kind: ImageDigestMirrorSet
      metadata:
        name: odf-catalog-mirrors
      spec:
        imageDigestMirrors:
          - source: registry.redhat.io/odf4/cephcsi-operator-bundle
            mirrors:
              - quay.io/rhceph-dev/odf4-cephcsi-operator-bundle
              - brew.registry.redhat.io/odf4/cephcsi-operator-bundle
          - source: registry.redhat.io/odf4/cephcsi-rhel9-operator
            mirrors:
              - quay.io/rhceph-dev/odf4-cephcsi-rhel9-operator
              - brew.registry.redhat.io/odf4/cephcsi-rhel9-operator
          - source: registry.redhat.io/odf4/cephcsi-rhel9
            mirrors:
              - quay.io/rhceph-dev/odf4-cephcsi-rhel9
              - brew.registry.redhat.io/odf4/cephcsi-rhel9
          - source: registry.redhat.io/odf4/devicefinder-rhel9
