  applications:
    acm:
      name: acm
      namespace: open-cluster-management
      argoProject: hub
      chart: acm
      chartVersion: 0.2.*
      ignoreDifferences:
        - group: internal.open-cluster-management.io
          kind: ManagedClusterInfo

    ensure-openshift-console-plugins:
      name: ensure-openshift-console-plugins
      namespace: openshift-console
      argoProject: opp
      chart: ensure-openshift-console-plugins
      chartVersion: 0.1.*
      extraValueFiles:
        - '$patternref/overrides/values-console-plugins-hub.yaml'

    observability:
      name: observability
      namespace: open-cluster-management-observability
      chart: openshift-observability
      chartVersion: 0.1.*
      extraValueFiles:
        - '$patternref/variants/odf/values-rdr-o11y.yaml'

    opp-policy:
      name: opp-policy
      namespace: openshift
      argoProject: opp
      chart: opp-policy-chart
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "5"
      syncPolicy:
        automated: {}
        retry:
          limit: 20
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - syncTimeout=3600s
          - CreateNamespace=true
          - PrunePropagationPolicy=foreground
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - CompareOptions=IgnoreExtraneous
      extraValueFiles:
        - '/overrides/values-cluster-names.yaml'
      ignoreDifferences:
      - group: operators.openshift.io
        kind: Console
        jsonPointers:
          - /spec/plugins
      # s3CaInjector / s3-ssl merge live Ramen ConfigMap content after apply.
      - group: ""
        kind: ConfigMap
        name: ramen-hub-operator-config
        namespace: openshift-operators
        jqPathExpressions:
          - .data["ramen_manager_config.yaml"]
      - group: ""
        kind: ConfigMap
        name: ramen-dr-cluster-operator-config
        namespace: openshift-dr-system
        jqPathExpressions:
          - .data["ramen_manager_config.yaml"]
      # PostSync / CronJob ansible workloads (s3-ssl, s3-ca-injector, submariner).
      - group: batch
        kind: Job
        jqPathExpressions:
          - .status
      - group: batch
        kind: CronJob
        jqPathExpressions:
          - .status
      # ACM policies reflect live cluster state after reconciliation.
      - group: policy.open-cluster-management.io
        kind: Policy
        jqPathExpressions:
          - .status

    vp-manage-proxy-cluster-ca:
      name: vp-manage-proxy-cluster-ca
      namespace: vp-manage-proxy-cluster-ca
      argoProject: hub
      chart: vp-manage-proxy-cluster-ca
      chartVersion: 0.2.*
      annotations:
        argocd.argoproj.io/sync-wave: "3"
      syncPolicy:
        automated: {}
        retry:
          limit: 20
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - RespectIgnoreDifferences=true
          - ServerSideApply=true
          - CreateNamespace=true
      extraValueFiles:
        - '$patternref/overrides/values-vp-manage-proxy-cluster-ca-hub.yaml'
      ignoreDifferences:
        # Newer than ESO 1.0; omit from chart manifests. Ignore only when live ESO defaults it.
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .spec.dataFrom[].extract.nullBytePolicy
        - group: trust.cert-manager.io
          kind: Bundle
          jqPathExpressions:
            - .status
        - group: ""
          kind: ConfigMap
          name: vp-pattern-proxy-ca-bundle
          namespace: openshift-config
          jqPathExpressions:
            - .data["ca-bundle.crt"]
        - group: config.openshift.io
          kind: Proxy
          name: cluster
          jqPathExpressions:
            - .status
        # ESO 1.1+ adds schema defaults to the live ExternalSecret that the chart intentionally
        # omits for ESO 1.0 compatibility. Suppress all four drifting fields at the Application
        # layer (as the chart comment in hub-externalsecret.yaml instructs):
        #   deletionPolicy: Retain   (target)
        #   engineVersion: v2        (target.template)
        #   mergePolicy: Replace     (target.template)
        - group: external-secrets.io
          kind: ExternalSecret
          name: cluster-ca-pushsecrets-import
          jqPathExpressions:
            - .spec.target.deletionPolicy
            - .spec.target.template.engineVersion
            - .spec.target.template.mergePolicy

    odf-dr:
      name: odf-dr
      namespace: regional-dr
      argoProject: opp
      chart: odf-dr-chart
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "8"
      syncPolicy:
        automated: {}
        retry:
          limit: 60
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - RespectIgnoreDifferences=true
      extraValueFiles:
        - '/overrides/values-cluster-names.yaml'
        - '/overrides/values-odf-dr-prerequisites.yaml'
      ignoreDifferences:
        - group: internal.open-cluster-management.io
          kind: ManagedClusterInfo
        # regional-dr owns this Job when regionaldr-with-virt >= 0.1.1; ignore spec/status drift.
        - group: batch
          kind: Job
          name: odf-dr-prerequisites-checker
          namespace: cluster-ca-mgt
          jqPathExpressions:
            - .spec
            - .status

    rdr:
      name: regional-dr
      namespace: regional-dr
      argoProject: opp
      chart: regionaldr-with-virt
      chartVersion: 0.1.*
      annotations:
        argocd.argoproj.io/sync-wave: "10"
      # automated starts on so install can settle; PostSync argocd-sync-disable
      # (regionaldr-with-virt >= 0.1.1) removes it and adds hub ignoreDifferences
      # so this desired automated: {} is not re-applied by parent selfHeal.
      syncPolicy:
        automated: {}
        # We have to wait for the clusters to build, which can take a long time
        retry:
          limit: 60
          backoff:
            duration: 5s
            factor: 2
            maxDuration: 3m
        syncOptions:
          - RespectIgnoreDifferences=true
      extraValueFiles:
        - '/overrides/values-cluster-names.yaml'
        - '/overrides/values-egv-dr.yaml'
        - '/overrides/values-odf-regional-dr.yaml'
        - '/overrides/values-aws-cost-optimized.yaml'
      ignoreDifferences:
        - group: internal.open-cluster-management.io
          kind: ManagedClusterInfo
        # regionaldr trusted-CA merge-patch on hub Ramen config.
        - group: ""
          kind: ConfigMap
          name: ramen-hub-operator-config
          namespace: openshift-operators
          jqPathExpressions:
            - .data["ramen_manager_config.yaml"]
        # PostSync settlement Jobs (drpc-health-check, argocd-sync-disable, etc.).
        - group: batch
          kind: Job
          jqPathExpressions:
            - .status
        # Operator-owned status on Ramen CRs after reconcile.
        - group: ramendr.openshift.io
          kind: DRPolicy
          jqPathExpressions:
            - .status
        - group: ramendr.openshift.io
          kind: DRCluster
          jqPathExpressions:
            - .status
        - group: ramendr.openshift.io
          kind: DRPlacementControl
          jqPathExpressions:
            - .status
        - group: ramendr.openshift.io
          kind: MaintenanceMode
          jqPathExpressions:
            - .status
        - group: cluster.open-cluster-management.io
          kind: PlacementDecision
          jqPathExpressions:
            - .status
        - group: external-secrets.io
          kind: ExternalSecret
          jqPathExpressions:
            - .status

    vault:
      name: vault
      namespace: vault
      argoProject: hub
      chart: hashicorp-vault
      chartVersion: 0.1.*

    openshift-external-secrets:
      name: openshift-external-secrets
      namespace: external-secrets
      argoProject: opp
      chart: openshift-external-secrets
      chartVersion: 0.0.*

    odf:
      name: odf
      namespace: openshift-storage
      argoProject: opp
      chart: openshift-data-foundations
      chartVersion: 0.3.*
      extraValueFiles:
        - '$patternref/overrides/values-odf-chart.yaml'

  imperative:
    verbosity: "-vvv"
    jobs: []

  managedClusterGroups:
    resilient:
      name: resilient
      helmOverrides:
        - name: clusterGroup.isHubCluster
          value: "false"
      acmlabels:
        - name: clusterGroup
          value: resilient
